# =============================================================================
# Smart Portfolio — Local Development Stack
# =============================================================================
# Usage:
#   docker compose up -d          # start the backend app
#   docker compose up -d --build  # rebuild the app image and start
#   docker compose logs -f app    # tail app logs
#   docker compose down           # stop the backend app
# =============================================================================

services:
  # ─────────────────────────────────────────────────────────────────────────
  # Smart Portfolio Application
  # Uses external Neon/Pinecone services configured in .env.
  # ─────────────────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-portfolio-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
